name: Create Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Automatisch PCF- en Solution-versies verhogen
      - name: Auto Increment PCF Version
        shell: pwsh
        run: |
          $buildNumber = 10000 + [int]$env:GITHUB_RUN_NUMBER

          $pcfVersion = "1.0.$buildNumber"
          $solutionVersion = "1.0.$buildNumber.0"

          # Update PCF manifest
          $manifestPath = "code-component/PowerDragDrop/ControlManifest.Input.xml"
          [xml]$manifest = Get-Content -Raw $manifestPath
          $manifest.SelectSingleNode('/manifest/control').SetAttribute('version', $pcfVersion)
          $manifest.Save((Join-Path $env:GITHUB_WORKSPACE $manifestPath))

          # Update Solution version
          $solutionPath = "solution/src/Other/Solution.xml"
          [xml]$solution = Get-Content -Raw $solutionPath
          $solution.SelectSingleNode('/ImportExportXml/SolutionManifest/Version').InnerText = $solutionVersion
          $solution.Save((Join-Path $env:GITHUB_WORKSPACE $solutionPath))

          Write-Host "PCF version: $pcfVersion"
          Write-Host "Solution version: $solutionVersion"

      - uses: actions/setup-node@v3.6.0
        with:
          node-version: "14.x"

      - run: npm ci
        working-directory: "./build-scripts"

      - run: npm ci
        working-directory: "./code-component"

      - uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '8.0.x'

      - run: dotnet build -c release
        working-directory: "./solution"

      
      - name: Upload PowerDragDrop ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PowerDragDrop-Solution
          path: |
            solution/bin/Release/Solution.zip
            solution/bin/Release/Solution_managed.zip
          if-no-files-found: error
          retention-days: 7
